[package]
name = "torse-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ab_glyph = "=0.2.32"
pollster = "0.4.0"
png = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
torse-assets = { path = "../../crates/assets" }
torse-content = { path = "../../crates/content" }
torse-inventory = { path = "../../modules/inventory" }
torse-codec = { path = "../../crates/codec" }
torse-net = { path = "../../crates/net" }
torse-protocol = { path = "../../crates/protocol" }
torse-render = { path = "../../crates/render" }
torse-runtime = { path = "../../crates/runtime" }
torse-sim = { path = "../../crates/sim" }
torse-types = { path = "../../crates/types" }
torse-world = { path = "../../crates/world" }
torse-world-services = { path = "../../crates/world_services" }
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "metal", "vulkan", "wgsl", "std"] }
winit = "=0.30.12"
